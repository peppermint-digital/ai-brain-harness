[package]
name = "ai-brain-harness"
version = "0.4.0"
edition = "2021"
description = "Verbindet einen Rechner mit einer AI-Brain-Instanz, stellt deren MCP-Server bereit und startet lokale Agentenlaeufe"
license = "MIT"
repository = "https://github.com/peppermint-digital/ai-brain-harness"

[dependencies]
ureq = { version = "2.10", features = ["json", "tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gethostname = "0.5"
sha2 = "0.10"
tungstenite = { version = "0.28", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
base64 = "0.22"
ai-brain-autostart = { path = "autostart" }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"

# Der Tray ist ein eigenes Binary: Er braucht eine Desktop-Sitzung, der
# Harness nicht — und ein Tray-Absturz soll keine Leitung kappen.
[workspace]
members = ["tray", "autostart"]
