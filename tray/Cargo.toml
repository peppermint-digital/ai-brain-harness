[package]
name = "ai-brain-tray"
version = "0.1.0"
edition = "2021"
description = "Tray für den AI-Brain-Harness: zeigt die Live-Leitung und schaltet sie"
license = "MIT"
repository = "https://github.com/peppermint-digital/ai-brain-harness"

[dependencies]
# Ohne tokio: der blockierende Weg über async-io reicht für ein Menü.
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "async-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
